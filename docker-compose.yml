
services:
  CadNutriDB:
    image: postgres:16
    container_name: CadNutriDB
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: CadNutriDB
    ports:
      - "5432:5432"
    volumes:
      - CadNutriDATA:/var/lib/postgresql/data
   
volumes:
  CadNutriDATA:
